<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <title>Firma digital – UGEL Talara</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111827;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1rem;
      gap: 1.25rem;
    }

    header { text-align: center; }
    header h1 { font-size: 1.2rem; font-weight: 700; color: #10b981; }
    header p  { font-size: 0.8rem; color: #9ca3af; margin-top: 0.25rem; }

    #instruccion {
      font-size: 0.85rem;
      color: #6b7280;
      text-align: center;
    }

    #lienzo-wrap {
      width: 100%;
      max-width: 480px;
      border-radius: 12px;
      border: 2px solid #374151;
      background: #1f2937;
      overflow: hidden;
      touch-action: none;
    }

    #lienzo {
      display: block;
      width: 100%;
      cursor: crosshair;
    }

    .botones {
      display: flex;
      gap: 0.75rem;
      width: 100%;
      max-width: 480px;
    }

    button {
      flex: 1;
      padding: 0.7rem 1rem;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:active:not(:disabled) { opacity: 0.75; }

    #btn-limpiar {
      background: #374151;
      color: #d1d5db;
    }

    #btn-guardar {
      background: #059669;
      color: #fff;
    }

    #estado {
      font-size: 0.82rem;
      padding: 0.6rem 1rem;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      display: none;
    }
    #estado.exito   { background: #064e3b; color: #6ee7b7; display: block; }
    #estado.error   { background: #450a0a; color: #fca5a5; display: block; }
    #estado.carga   { background: #1e293b; color: #94a3b8;  display: block; }

    #descarga-wrap {
      width: 100%;
      max-width: 480px;
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }
    #descarga-wrap.visible { display: flex; }

    #preview-svg {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #fff;
      max-height: 120px;
      object-fit: contain;
    }

    #btn-descargar {
      background: #1d4ed8;
      color: #fff;
    }

    footer {
      font-size: 0.75rem;
      color: #4b5563;
      text-align: center;
      margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <h1>SIGPER – Firma digital</h1>
    <p>UGEL Talara</p>
  </header>

  <p id="instruccion">Dibuja tu firma en el recuadro inferior</p>

  <div id="lienzo-wrap">
    <canvas id="lienzo"></canvas>
  </div>

  <div class="botones">
    <button id="btn-limpiar" type="button">Limpiar</button>
    <button id="btn-guardar" type="button" disabled>Guardar firma</button>
  </div>

  <div id="estado"></div>

  <div id="descarga-wrap">
    <img id="preview-svg" alt="Vista previa de la firma" />
    <button id="btn-descargar" type="button">⬇ Descargar SVG</button>
  </div>

  <footer>Intranet UGEL Talara · Acceso restringido al personal autorizado</footer>

  <script src="script.js"></script>
</body>
</html>
